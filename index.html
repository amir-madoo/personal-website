<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Updating | Amir Madoo</title>
    <meta name="description" content="Site is currently undergoing updates. Please check back soon." />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #08090d;
        --card-bg: rgba(18, 20, 29, 0.72);
        --card-border: rgba(255, 255, 255, 0.09);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.35);
        --accent-cyan: #06b6d4;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        width: 100%;
        background-color: var(--bg-color);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        padding: 1.5rem;
      }

      /* Ambient Background Glows */
      .ambient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.45;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb-1 {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, #059669 0%, rgba(5, 150, 105, 0) 70%);
        top: -120px;
        left: -100px;
      }

      .orb-2 {
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, #2563eb 0%, rgba(37, 99, 235, 0) 70%);
        bottom: -150px;
        right: -120px;
        animation-delay: -7s;
      }

      .orb-3 {
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, #0d9488 0%, rgba(13, 148, 136, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.25;
      }

      /* Subtle Grid Background Pattern */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 70%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 70%, transparent 100%);
        z-index: 1;
        pointer-events: none;
      }

      /* Central Card Container */
      .update-card {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 480px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        padding: 3.25rem 2.5rem;
        text-align: center;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6),
                    0 0 0 1px rgba(255, 255, 255, 0.04) inset;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        transition: transform 0.3s ease, border-color 0.3s ease;
      }

      .update-card:hover {
        border-color: rgba(255, 255, 255, 0.16);
      }

      /* Brand Icon / Logo */
      .brand-badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .brand-badge svg {
        width: 34px;
        height: 34px;
        stroke: var(--text-primary);
      }

      /* Status Pill */
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 1rem;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.28);
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #34d399;
      }

      .status-dot {
        position: relative;
        width: 8px;
        height: 8px;
        background-color: var(--accent);
        border-radius: 50%;
      }

      .status-dot::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background-color: var(--accent);
        opacity: 0.6;
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Typography */
      .title {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.025em;
        background: linear-gradient(135deg, #ffffff 20%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .description {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-secondary);
        font-weight: 400;
        max-width: 380px;
      }

      /* Glowing Loader Track */
      .loader-container {
        width: 100%;
        max-width: 260px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      .loader-track {
        width: 100%;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .loader-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #10b981, #06b6d4, transparent);
        border-radius: 9999px;
        animation: shimmer-load 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .loader-text {
        font-size: 0.825rem;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.45);
        text-transform: uppercase;
        font-weight: 500;
      }

      /* Footer Note */
      .footer-note {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 0.02em;
        margin-top: 0.5rem;
      }

      /* Keyframe Animations */
      @keyframes float {
        0% {
          transform: translateY(0px) scale(1);
        }
        100% {
          transform: translateY(30px) scale(1.08);
        }
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.9);
          opacity: 0.8;
        }
        70% {
          transform: scale(2.4);
          opacity: 0;
        }
        100% {
          transform: scale(2.4);
          opacity: 0;
        }
      }

      @keyframes shimmer-load {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      @media (max-width: 480px) {
        .update-card {
          padding: 2.5rem 1.75rem;
          border-radius: 24px;
        }

        .title {
          font-size: 1.65rem;
        }

        .description {
          font-size: 0.925rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Ambient glowing backgrounds -->
    <div class="ambient-orb orb-1" aria-hidden="true"></div>
    <div class="ambient-orb orb-2" aria-hidden="true"></div>
    <div class="ambient-orb orb-3" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- Centered Card -->
    <main class="update-card" role="main">
      <div class="brand-badge" aria-hidden="true">
        <svg viewBox="0 0 130 110" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 32 82 C 14 72, 8 38, 22 22 C 34 8, 62 10, 72 26 C 80 40, 76 60, 58 72 C 46 80, 40 88, 48 92 C 56 94, 64 84, 58 74" />
          <path d="M 58 74 L 64 22 L 76 70" />
          <path d="M 60 52 L 73 49" />
          <path d="M 18 86 L 108 34" />
        </svg>
      </div>

      <div class="status-pill">
        <span class="status-dot"></span>
        <span>Updating</span>
      </div>

      <h1 class="title">Under Construction</h1>

      <p class="description">
        Currently upgrading and updating the website. Please check back soon.
      </p>

      <div class="loader-container" aria-label="Loading progress">
        <div class="loader-track">
          <div class="loader-fill"></div>
        </div>
        <span class="loader-text">Loading updates...</span>
      </div>

      <footer class="footer-note">
        &copy; 2026 &bull; amirmadoo.com
      </footer>
    </main>
  </body>
</html>
